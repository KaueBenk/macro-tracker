[project]
name = "macro-tracker"
version = "0.1.0"
description = "Personal macronutrient tracking API"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic==1.14.1",
    "asyncpg==0.30.0",
    "fastapi==0.115.6",
    "httpx==0.28.1",
    "jinja2==3.1.6",
    "mcp==2.1.1",
    "pydantic==2.13.4",
    "pydantic-settings==2.7.1",
    "python-multipart==0.0.20",
    "sqlalchemy[asyncio]==2.0.36",
]

[dependency-groups]
dev = [
    "mypy==1.14.1",
    "pytest==8.3.4",
    "pytest-asyncio==0.25.2",
    "ruff==0.9.2",
    "uvicorn==0.34.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = "(^alembic/|^tests/fixtures/)"

[[tool.mypy.overrides]]
module = ["asyncpg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
