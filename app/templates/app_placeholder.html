{% extends "base.html" %}
{% block title %}Macro Tracker{% endblock %}
{% block content %}
<section class="card">
  <h1>Macro Tracker</h1>
  <p>Você está conectado como <strong>{{ user.email }}</strong>.</p>
  <form method="post" action="/web/logout">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <button type="submit">Sair</button>
  </form>
</section>
{% endblock %}
